<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 20px 30px;
            animation: fadeIn 2s ease-out;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu-item {
            margin: 15px 0;
            padding: 10px 20px;
            border: 2px dashed #2c3e50;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .menu-item:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .menu-item h2 {
            font-size: 1.5rem;
            color: #34495e;
        }

        .menu-item span {
            font-size: 1.2rem;
            color: #16a085;
        }

        .title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #e74c3c;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">EFE İLE LOL OYNAMAK NE KADAR</div>
        <div class="menu-item">
            <h2>ARDEN FEEDLER EFE TAŞIR</h2>
            <span>100 TL</span>
        </div>
        <div class="menu-item">
            <h2>TAKIM FEEDLER EFE TAŞIR</h2>
            <span>400 TL</span>
        </div>
        <div class="menu-item">
            <h2>EFE FEEDLER TAKIM TAŞIR</h2>
            <span>20 TL</span>
        </div>
        <div class="menu-item">
            <h2>EFE FEEDLER ARDEN TAŞIR</h2>
            <span>♾️ TL</span>
        </div>
        <div class="footer">Steam bakiyesi olarak ödeme alıyoruz! Maç başı fiyattır indirim teklif etmeyiniz</div>
    </div>
</body>
</html>
